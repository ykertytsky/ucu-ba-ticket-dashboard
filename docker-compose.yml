services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/helpdesk.db
      # Optional access gate (same value = login password). No SQLite required.
      # DASHBOARD_GATE_SECRET: "replace-with-long-random"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
